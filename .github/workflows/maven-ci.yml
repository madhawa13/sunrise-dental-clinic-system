name: Maven CI and WAR Build

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    name: Test and Package Java Web Application

    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4

        env:
          MYSQL_ROOT_PASSWORD: ci_password
          MYSQL_DATABASE: sunrise_dental_clinic

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping
          -h 127.0.0.1
          -uroot
          -pci_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Display Java and Maven versions
        run: |
          java -version
          mvn -version

      - name: Create CI database configuration
        run: |
          cat > src/main/resources/db.properties <<'EOF'
          db.url=jdbc:mysql://127.0.0.1:3306/sunrise_dental_clinic?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Colombo
          db.username=root
          db.password=ci_password
          db.driver=com.mysql.cj.jdbc.Driver
          EOF

      - name: Run automated tests and build WAR
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Upload deployable WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: sunrise-dental-clinic-war
          path: target/*.war
          if-no-files-found: error
          retention-days: 30